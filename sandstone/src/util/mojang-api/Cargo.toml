[package]
name = "mojang-api"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "query"] }
log = "0.4.33"
sha1 = "0.11.0"
tokio = {version = "1.53.1", features = ["sync", "macros"]}
uuid = { version = "1.24.0", features = ["v4"] }

[dev-dependencies]
rsa = { version = "0.10.0-rc.18", features = ["std"] }
rand_chacha = "0.10.0"
