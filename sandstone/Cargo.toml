[package]
name = "sandstone"
version = "0.2.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
description = "Networking library for Minecraft: Java Edition servers"
repository = "https://github.com/dec4234/sandstone"
readme = "../README.md"
keywords = ["minecraft", "networking", "server", "protocol"]
categories = ["network-programming", "game-development", "game-engines"]

exclude = ["src/sandstone-derive"]

[dependencies]
tokio = { version = "1.54.1", features = ["net", "io-util"] }
serde_json = "1.0.154"
serde = { version = "1.0.229", features = ["derive"] }
uuid = { version = "1.29.3", features = ["v4"] }
log = "0.4.35"
flate2 = "1.1.11"
thiserror = "2.0.21"
# Used only by the `server` and `encryption` features.
rand = { version = "0.10.4", optional = true }
paste = "1.0"
cesu8 = "1.1.0"
# Checks the format of Identifier text.
regex = "1.13.2"
# Used only by the `server` feature.
smart-default = { version = "0.7.1", optional = true }

sandstone-derive = { version = "0.2.0", path = "src/sandstone-derive" }
# Always used for the HasJoinedResponse and HttpError types. The `auth` feature adds its HTTP client.
# Published as sandstone-mojang-api. The name mojang-api on crates.io is a different crate.
mojang-api = { package = "sandstone-mojang-api", version = "0.1.0", path = "src/util/sandstone-mojang-api", default-features = false }
# Used only by the `anvil` feature (LZ4 compressed chunks).
lz4_flex = { version = "0.14.2", optional = true }
xxhash-rust = { version = "0.8.21", features = ["xxh32"], optional = true }
# Used only by the `favicon` feature. Only the PNG codec is enabled.
image = { version = "0.25.10", default-features = false, features = ["png"], optional = true }
base64 = { version = "0.23.1", optional = true }
# Used only by the `encryption` feature
aes = { version = "0.9.4", optional = true }
cfb8 = { version = "0.9.1", optional = true }
rsa = { version = "0.10.0", features = ["std", "pkcs1v15"], optional = true }
# Used only by the `dns` feature (SRV record lookup in CraftConnection::connect).
hickory-resolver = { version = "0.26.4", optional = true }
# Renders the `##` feature comments below into the crate docs.
document-features = "0.2.12"

[features]
## Enables all features except `testing`.
default = ["client", "server", "anvil", "favicon", "dns", "encryption", "online"]
## Client-side handlers in `network::client` (for example `DefaultClientStatusHandler`).
client = []
## Server-side handlers in `network::server` (handshake, status, ping, login and encryption handlers).
server = ["dep:rand", "dep:smart-default"]
## Read and write Anvil region files (.mca) and convert chunks to and from chunk packets.
anvil = ["dep:lz4_flex", "dep:xxhash-rust"]
## Set the server list icon from an `image::DynamicImage` (`StatusResponseSpec::set_favicon_image`).
favicon = ["dep:image", "dep:base64"]
## DNS SRV lookup for server addresses in `CraftConnection::connect`.
dns = ["dep:hickory-resolver"]
## Connection encryption (AES/CFB8 with an RSA key exchange).
encryption = ["dep:rand", "dep:aes", "dep:cfb8", "dep:rsa"]
## Online server authentication for real Minecraft accounts. Enables `server` and `encryption`.
online = ["server", "encryption", "mojang-api/http"]
## Enables testing functions
testing = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dev-dependencies]
tokio = { version = "1.54.1", features = ["net", "io-util", "rt", "macros", "time"] }

[lints.rust]
mismatched_lifetime_syntaxes = "allow"
