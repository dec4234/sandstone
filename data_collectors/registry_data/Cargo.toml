[package]
name = "registry_data"
version = "0.1.0"
edition = "2024"

[dependencies]
sandstone = {path = "../../sandstone"}
sandstone-derive = {path = "../../sandstone/src/sandstone-derive"}
tokio = {version = "1.53.1", features = ["full", "macros"]}
simple_logger = "5.2.0"
log = "0.4.33"
uuid = { version = "1.24.0", features = ["v4"] }
serde_json = {version = "1.0.151", features = ["default"]}
serde = {version = "1.0.229", features = ["derive"]}